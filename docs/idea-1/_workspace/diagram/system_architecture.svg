<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 660">
  <style>
    text { font-family: 'JetBrains Mono', 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polyline points="0 0, 10 3.5, 0 7" fill="none" stroke="#fb7185" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
  </defs>

  <!-- 1. background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- 2. region boundaries -->
  <rect x="30" y="82" width="1120" height="252" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="42" y="100" fill="#fbbf24" font-size="9" font-weight="600">요청 흐름 — 미션 수행과 학습 제공</text>
  <rect x="30" y="376" width="1120" height="150" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="42" y="394" fill="#fbbf24" font-size="9" font-weight="600">외부 데이터 파이프라인 — 조회·검증·적재</text>

  <!-- 3. arrows -->
  <!-- request lane: app → gw → api → ai -->
  <line x1="230" y1="174" x2="308" y2="174" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="470" y1="174" x2="548" y2="174" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="750" y1="174" x2="838" y2="174" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="269" y="164" fill="#94a3b8" font-size="8" text-anchor="middle">미션 요청</text>
  <text x="509" y="164" fill="#94a3b8" font-size="8" text-anchor="middle">인증·라우팅</text>
  <text x="794" y="164" fill="#94a3b8" font-size="8" text-anchor="middle">컨텍스트 전달</text>
  <!-- return feedback: ai model → user app (dashed, over the top) -->
  <path d="M 980,142 L 980,118 L 145,118 L 145,142" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-blue)"/>
  <text x="562" y="112" fill="#60a5fa" font-size="8" text-anchor="middle">실시간 안내·피드백 생성 (AI 적용)</text>
  <!-- api server ↔ db -->
  <line x1="650" y1="206" x2="650" y2="236" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <text x="662" y="226" fill="#94a3b8" font-size="8">판정 결과·학습 이력 기록</text>
  <!-- pipeline lane: request (dashed, right→left, upper) / data (solid, left→right, lower) -->
  <line x1="330" y1="438" x2="264" y2="438" stroke="#fb7185" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-rose)"/>
  <line x1="570" y1="438" x2="504" y2="438" stroke="#fb7185" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-rose)"/>
  <text x="297" y="430" fill="#fb7185" font-size="8" text-anchor="middle">조회 요청</text>
  <text x="537" y="430" fill="#fb7185" font-size="8" text-anchor="middle">요청만 송신</text>
  <line x1="264" y1="472" x2="328" y2="472" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="504" y1="472" x2="568" y2="472" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="754" y1="455" x2="818" y2="455" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="296" y="486" fill="#94a3b8" font-size="8" text-anchor="middle">조회 응답</text>
  <text x="536" y="486" fill="#94a3b8" font-size="8" text-anchor="middle">원천 데이터</text>
  <text x="786" y="447" fill="#94a3b8" font-size="8" text-anchor="middle">적재 전 검증</text>
  <!-- verified data up to DB -->
  <path d="M 910,425 L 910,272 L 716,272" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <text x="924" y="330" fill="#a78bfa" font-size="8">검증·정제 후 적재</text>

  <!-- 4. mask layer -->
  <rect x="60" y="142" width="170" height="64" rx="6" fill="#0f172a"/>
  <rect x="310" y="142" width="160" height="64" rx="6" fill="#0f172a"/>
  <rect x="550" y="142" width="200" height="64" rx="6" fill="#0f172a"/>
  <rect x="840" y="142" width="280" height="64" rx="6" fill="#0f172a"/>
  <rect x="60" y="425" width="204" height="60" rx="6" fill="#0f172a"/>
  <rect x="330" y="425" width="174" height="60" rx="6" fill="#0f172a"/>
  <rect x="570" y="425" width="184" height="60" rx="6" fill="#0f172a"/>
  <rect x="820" y="425" width="180" height="60" rx="6" fill="#0f172a"/>

  <!-- 5. component boxes -->
  <!-- 사용자 앱 -->
  <rect x="60" y="142" width="170" height="64" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="145" y="168" fill="white" font-size="12" font-weight="600" text-anchor="middle">사용자 앱</text>
  <text x="145" y="186" fill="#94a3b8" font-size="9" text-anchor="middle">금융 미션 수행 · 학습</text>
  <!-- API G/W -->
  <rect x="310" y="142" width="160" height="64" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="390" y="168" fill="white" font-size="12" font-weight="600" text-anchor="middle">API G/W</text>
  <text x="390" y="186" fill="#94a3b8" font-size="9" text-anchor="middle">인증 · 라우팅</text>
  <!-- API 서버 -->
  <rect x="550" y="142" width="200" height="64" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="650" y="164" fill="white" font-size="12" font-weight="600" text-anchor="middle">API 서버</text>
  <text x="650" y="180" fill="#94a3b8" font-size="9" text-anchor="middle">정답 판정 · 학습 결과 처리</text>
  <text x="650" y="196" fill="#34d399" font-size="8" font-weight="600" text-anchor="middle">AI 미적용 — 결정론 처리</text>
  <!-- AI 모델 -->
  <rect x="840" y="142" width="280" height="64" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="980" y="164" fill="white" font-size="12" font-weight="600" text-anchor="middle">AI 모델</text>
  <text x="980" y="180" fill="#94a3b8" font-size="9" text-anchor="middle">Instruction LLM + Context Prompting + RAG</text>
  <text x="980" y="196" fill="#60a5fa" font-size="8" font-weight="600" text-anchor="middle">AI 적용 — 실시간 안내·피드백</text>
  <!-- DB cylinder -->
  <g>
    <rect x="590" y="246" width="126" height="64" rx="2" fill="#0f172a"/>
    <ellipse cx="653" cy="246" rx="63" ry="12" fill="#0f172a"/>
    <ellipse cx="653" cy="310" rx="63" ry="12" fill="#0f172a"/>
    <rect x="590" y="246" width="126" height="64" fill="rgba(76,29,149,0.4)"/>
    <ellipse cx="653" cy="246" rx="63" ry="12" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <ellipse cx="653" cy="310" rx="63" ry="12" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="590" y1="246" x2="590" y2="310" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="716" y1="246" x2="716" y2="310" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="653" y="278" fill="white" font-size="11" font-weight="600" text-anchor="middle">DB</text>
    <text x="653" y="295" fill="#c4b5fd" font-size="8" text-anchor="middle">역량 프로필 · 학습 이력</text>
  </g>
  <!-- 외부 공공·금융 데이터 -->
  <rect x="60" y="425" width="204" height="60" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="162" y="450" fill="white" font-size="12" font-weight="600" text-anchor="middle">외부 공공·금융 데이터</text>
  <text x="162" y="467" fill="#94a3b8" font-size="9" text-anchor="middle">공식 자료 · 통계</text>
  <!-- 프록시 -->
  <rect x="330" y="425" width="174" height="60" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="417" y="450" fill="white" font-size="12" font-weight="600" text-anchor="middle">프록시</text>
  <text x="417" y="467" fill="#fb7185" font-size="9" text-anchor="middle">조회 요청만 송신 — 격리 경계</text>
  <!-- 데이터 파이프라인 -->
  <rect x="570" y="425" width="184" height="60" rx="6" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="662" y="450" fill="white" font-size="12" font-weight="600" text-anchor="middle">데이터 파이프라인</text>
  <text x="662" y="467" fill="#94a3b8" font-size="9" text-anchor="middle">수집 · 적재 관리</text>
  <!-- AI 검증·정제 -->
  <rect x="820" y="425" width="180" height="60" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="910" y="450" fill="white" font-size="12" font-weight="600" text-anchor="middle">AI 검증·정제</text>
  <text x="910" y="467" fill="#60a5fa" font-size="9" text-anchor="middle">AI 적용 — 적재 전 검증</text>

  <!-- 7. legend -->
  <g transform="translate(770, 560)">
    <rect x="0" y="0" width="380" height="64" rx="8" fill="rgba(30,41,59,0.5)" stroke="#334155" stroke-width="1"/>
    <rect x="14" y="14" width="12" height="12" rx="3" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="34" y="24" fill="#e2e8f0" font-size="9">AI 적용 — LLM·RAG 안내, 적재 전 검증</text>
    <rect x="14" y="38" width="12" height="12" rx="3" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="34" y="48" fill="#e2e8f0" font-size="9">AI 미적용 — 정답 판정·학습 결과 (결정론)</text>
    <rect x="216" y="14" width="12" height="12" rx="3" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
    <text x="236" y="24" fill="#e2e8f0" font-size="9">보안 경계 (프록시)</text>
    <rect x="216" y="38" width="12" height="12" rx="3" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="236" y="48" fill="#e2e8f0" font-size="9">저장소 (DB)</text>
  </g>

  <!-- 8. title block -->
  <text x="30" y="42" fill="white" font-size="16" font-weight="700">금융 코디세이 — 예상 시스템 구성</text>
  <text x="30" y="62" fill="#94a3b8" font-size="10">요청 흐름 + 외부 데이터 파이프라인 · AI 적용/미적용 구분</text>
</svg>
