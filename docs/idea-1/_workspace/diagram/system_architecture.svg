<svg id="sys-arch" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 660">
  <style>
    #sys-arch text { font-family: 'JetBrains Mono', 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb923c"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
  </defs>

  <!-- 1. background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- 2. region boundaries -->
  <rect x="30" y="82" width="1120" height="252" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="42" y="100" fill="#fbbf24" font-size="9" font-weight="600">요청 흐름 — 미션 수행과 학습 제공</text>
  <rect x="30" y="376" width="1120" height="150" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="42" y="394" fill="#fbbf24" font-size="9" font-weight="600">외부 데이터 파이프라인 — 원문 수신 · 정제 · 임베딩</text>

  <!-- 3. arrows -->
  <!-- request lane: app → gw → api → ai -->
  <line x1="230" y1="174" x2="308" y2="174" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="470" y1="174" x2="548" y2="174" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="750" y1="174" x2="838" y2="174" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="269" y="164" fill="#94a3b8" font-size="8" text-anchor="middle">미션 수행 요청</text>
  <text x="509" y="164" fill="#94a3b8" font-size="8" text-anchor="middle">인증 · 인가</text>
  <text x="794" y="164" fill="#94a3b8" font-size="8" text-anchor="middle">미션 컨텍스트</text>
  <!-- return feedback: ai model → user app (dashed, over the top) -->
  <path d="M 980,142 L 980,118 L 145,118 L 145,142" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-blue)"/>
  <text x="562" y="112" fill="#60a5fa" font-size="8" text-anchor="middle">가이드 · 피드백 · 근거 (AI 적용)</text>
  <!-- api server ↔ db -->
  <line x1="650" y1="206" x2="650" y2="236" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <text x="540" y="226" fill="#94a3b8" font-size="8">프로필 조회 · 수행기록 저장</text>
  <!-- ai ↔ db: 근거 검색 / 임베딩 적재 -->
  <path d="M 980,206 L 980,276 L 720,276" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <text x="800" y="266" fill="#a78bfa" font-size="8">임베딩 적재 · 근거 검색(RAG)</text>
  <!-- pipeline lane: source → pipeline -->
  <line x1="320" y1="455" x2="388" y2="455" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="354" y="447" fill="#94a3b8" font-size="8" text-anchor="middle">원문 수신</text>
  <!-- pipeline → ai: 정제 텍스트 임베딩 요청 -->
  <path d="M 620,455 L 1060,455 L 1060,210" fill="none" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-orange)"/>
  <text x="840" y="447" fill="#fb923c" font-size="8" text-anchor="middle">정제 텍스트 임베딩 요청</text>

  <!-- 4. mask layer -->
  <rect x="60" y="142" width="170" height="64" rx="6" fill="#0f172a"/>
  <rect x="310" y="142" width="160" height="64" rx="6" fill="#0f172a"/>
  <rect x="550" y="142" width="200" height="64" rx="6" fill="#0f172a"/>
  <rect x="840" y="142" width="280" height="64" rx="6" fill="#0f172a"/>
  <rect x="60" y="425" width="260" height="60" rx="6" fill="#0f172a"/>
  <rect x="390" y="425" width="230" height="60" rx="6" fill="#0f172a"/>

  <!-- 5. component boxes -->
  <!-- 사용자 앱 -->
  <rect x="60" y="142" width="170" height="64" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="145" y="168" fill="white" font-size="12" font-weight="600" text-anchor="middle">사용자 앱</text>
  <text x="145" y="186" fill="#94a3b8" font-size="9" text-anchor="middle">금융 미션 수행 · 학습</text>
  <!-- API G/W -->
  <rect x="310" y="142" width="160" height="64" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="390" y="168" fill="white" font-size="12" font-weight="600" text-anchor="middle">API Gateway</text>
  <text x="390" y="186" fill="#94a3b8" font-size="9" text-anchor="middle">인증 · 인가</text>
  <!-- API 서버 -->
  <rect x="550" y="142" width="200" height="64" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="650" y="164" fill="white" font-size="12" font-weight="600" text-anchor="middle">API 서버</text>
  <text x="650" y="180" fill="#94a3b8" font-size="9" text-anchor="middle">정답 판정 · 수행기록 처리</text>
  <text x="650" y="196" fill="#34d399" font-size="8" font-weight="600" text-anchor="middle">AI 미적용 — 결정론 처리</text>
  <!-- AI 모델 -->
  <rect x="840" y="142" width="280" height="64" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="980" y="164" fill="white" font-size="12" font-weight="600" text-anchor="middle">AI 모델 (LLM)</text>
  <text x="980" y="180" fill="#94a3b8" font-size="9" text-anchor="middle">Instruction LLM + Context Prompting + RAG</text>
  <text x="980" y="196" fill="#60a5fa" font-size="8" font-weight="600" text-anchor="middle">AI 적용 — 가이드·피드백·근거 생성</text>
  <!-- DB cylinder -->
  <g>
    <rect x="590" y="246" width="126" height="64" rx="2" fill="#0f172a"/>
    <ellipse cx="653" cy="246" rx="63" ry="12" fill="#0f172a"/>
    <ellipse cx="653" cy="310" rx="63" ry="12" fill="#0f172a"/>
    <rect x="590" y="246" width="126" height="64" fill="rgba(76,29,149,0.4)"/>
    <ellipse cx="653" cy="246" rx="63" ry="12" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <ellipse cx="653" cy="310" rx="63" ry="12" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="590" y1="246" x2="590" y2="310" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="716" y1="246" x2="716" y2="310" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="653" y="278" fill="white" font-size="11" font-weight="600" text-anchor="middle">Database</text>
    <text x="653" y="295" fill="#c4b5fd" font-size="8" text-anchor="middle">프로필 · 수행기록 · 임베딩</text>
  </g>
  <!-- 금융 공공정보 -->
  <rect x="60" y="425" width="260" height="60" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="190" y="450" fill="white" font-size="12" font-weight="600" text-anchor="middle">금융 공공정보 · 제도 혜택정보</text>
  <text x="190" y="467" fill="#94a3b8" font-size="9" text-anchor="middle">공공데이터 원문</text>
  <!-- 데이터 파이프라인 -->
  <rect x="390" y="425" width="230" height="60" rx="6" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="505" y="450" fill="white" font-size="12" font-weight="600" text-anchor="middle">데이터 파이프라인</text>
  <text x="505" y="467" fill="#94a3b8" font-size="9" text-anchor="middle">원문 수집 · 정제</text>

  <!-- 7. legend -->
  <g transform="translate(770, 560)">
    <rect x="0" y="0" width="380" height="64" rx="8" fill="rgba(30,41,59,0.5)" stroke="#334155" stroke-width="1"/>
    <rect x="14" y="14" width="12" height="12" rx="3" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="34" y="24" fill="#e2e8f0" font-size="9">AI 적용 — LLM·RAG 가이드·피드백·근거</text>
    <rect x="14" y="38" width="12" height="12" rx="3" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="34" y="48" fill="#e2e8f0" font-size="9">AI 미적용 — 정답 판정·수행기록 (결정론)</text>
    <rect x="216" y="14" width="12" height="12" rx="3" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
    <text x="236" y="24" fill="#e2e8f0" font-size="9">외부 데이터 파이프라인</text>
    <rect x="216" y="38" width="12" height="12" rx="3" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="236" y="48" fill="#e2e8f0" font-size="9">저장소 (DB)</text>
  </g>

  <!-- 8. title block -->
  <text x="30" y="42" fill="white" font-size="16" font-weight="700">금융 코디세이 — 예상 시스템 구성</text>
  <text x="30" y="62" fill="#94a3b8" font-size="10">요청 흐름 + 외부 데이터 파이프라인 · AI 적용/미적용 구분</text>
</svg>
