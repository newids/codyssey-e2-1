<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="0; url=../pitch-deck/">
<link rel="canonical" href="../pitch-deck/">
<meta name="robots" content="noindex, follow">
<title>발표자료가 이동했습니다 — 금융 코디세이</title>
<meta name="color-scheme" content="light">
<style>
  :root {
    --paper: oklch(97.5% 0.006 85);
    --ink: oklch(24% 0.015 260);
    --ink-soft: oklch(42% 0.012 260);
    --accent: oklch(48% 0.13 250);
    --accent-deep: oklch(42% 0.14 250);
    --font-sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
      "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--paper); color: var(--ink); font-family: var(--font-sans);
    line-height: 1.75; word-break: keep-all;
    min-height: 100vh; display: grid; place-items: center; padding: 2rem;
  }
  main { max-width: 32rem; text-align: center; }
  h1 { font-size: clamp(1.4rem, 1.1rem + 1.4vw, 2rem); letter-spacing: -0.02em; font-weight: 800; }
  p { margin-top: 1rem; color: var(--ink-soft); font-size: .95rem; }
  a.btn {
    display: inline-block; margin-top: 1.75rem; text-decoration: none; font-weight: 700;
    background: var(--accent); color: oklch(98% 0 0);
    padding: .75rem 1.4rem; border-radius: .55rem; border: 1px solid var(--accent);
  }
  a.btn:hover { background: var(--accent-deep); }
  a.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  a.plain { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>발표자료가 이동했습니다</h1>
  <p>이 주소는 더 이상 사용하지 않습니다. 잠시 뒤 새 주소로 이동하며, 이동하지 않으면 아래 링크를 눌러 주세요.</p>
  <a class="btn" href="../pitch-deck/">발표자료 보러 가기</a>
  <p>새 주소: <a class="plain" href="../pitch-deck/">/pitch-deck/</a></p>
  <p><a class="plain" href="../">기획안 본문으로 돌아가기</a></p>
</main>
</body>
</html>
